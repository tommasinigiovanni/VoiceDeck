name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test audio, transcripts and API contract
        run: swift test --disable-sandbox
      - name: Build macOS app
        run: bash scripts/build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/VoiceDeck.app build/VoiceDeck-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceDeck-macOS
          path: build/VoiceDeck-macOS.zip
